slam_toolbox:
  ros__parameters:
    use_sim_time: true

    mode: mapping

    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: base_scan

    resolution: 0.05
    max_laser_range: 5.0

    minimum_time_interval: 0.5
    map_update_interval: 1.0
    transform_publish_period: 0.05
    publish_period: 0.05

    publish_to_tf: true